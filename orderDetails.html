<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Details</title>


  <link rel="stylesheet" href="CSS/orderDetails.css" />


  <link rel="stylesheet" href="CSS/style.css" />
  <link rel="stylesheet" href="CSS/oDetails.css" />
</head>

<body>

  <div id="navbar"></div>

  <div class="order-details-wrapper">


    <div class="checkout-steps">
      <div class="step completed">📝 Order</div>
      <div class="step active">👁️‍🗨️ Details</div>
      <div class="step">💳 Payment</div>
    </div>

    <div id="order-details-root"></div>
  </div>


  <script src="JS/script.js"></script>

  <!-- React -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const PRODUCT_LABELS = {
      sofa: "Modern Sofa – 450€",
      chair: "Chair",
      table: "Table",
      bed: "Bed",
    };

    function OrderDetails() {
      const [order, setOrder] = useState(null);


      useEffect(() => {
        const raw = localStorage.getItem("orderData");
        if (!raw) return;

        try {
          setOrder(JSON.parse(raw));
        } catch {
          console.log("Error while reading order data");
        }
      }, []);

      
      if (!order) {
        return (
          <div className="order-details-card">
            <h2>No saved order</h2>
            <p>
              Please go back to the order page and fill in your order first.
            </p>

            <button
              className="order-btn"
              onClick={() => (window.location.href = "order.html")}
            >
              Go to order page
            </button>
          </div>
        );
      }

      const productName = PRODUCT_LABELS[order.product] || order.product;

      return (
        <div className="order-details-card">
          <span className="order-badge">
            Active • Order in progress
          </span>

          <div className="details-header">
            <div>
              <h2>📦 Order Overview</h2>
              <p>Review your order details before continuing.</p>
            </div>

            <div className="total-box">
              <span>Total</span>
              <strong>{order.total || "0€"}</strong>
            </div>
          </div>

          <div className="details-content">
            <p>
              <strong>Product:</strong> {productName}
            </p>
            <p>
              <strong>Quantity:</strong> {order.quantity || 1}
            </p>
            {order.color && (
              <p>
                <strong>Color:</strong> {order.color}
              </p>
            )}
            {order.material && (
              <p>
                <strong>Material:</strong> {order.material}
              </p>
            )}
            {order.date && (
              <p>
                <strong>Delivery date:</strong> {order.date}
              </p>
            )}
            {order.notes && (
              <p>
                <strong>Notes:</strong> {order.notes}
              </p>
            )}
          </div>

          <div className="order-actions">
            <button
              className="order-btn order-btn-secondary"
              onClick={() => (window.location.href = "order.html")}
            >
              Back to order
            </button>

            <button
              className="order-btn"
              onClick={() => (window.location.href = "orderPayment.html")}
            >
              Continue to payment
            </button>
          </div>

          <button
            className="order-btn"
            style={{ marginTop: "12px" }}
            onClick={() => {
              localStorage.removeItem("orderData");
              window.location.reload();
            }}
          >
            Clear order
          </button>
        </div>
      );
    }

    ReactDOM.createRoot(
      document.getElementById("order-details-root")
    ).render(<OrderDetails />);
  </script>

</body>
</html>
