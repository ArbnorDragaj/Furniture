<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <link rel="stylesheet" href="CSS/order.css" />
    <link rel="stylesheet" href="CSS/style.css" />
     <title>A&O Furniture/Order</title>
  </head>
  <body>
    <div id="navbar">

    </div>

    
    <!--Order form-->
    <section class="order-section">
      <h1 class="order-title">Place Your Order</h1>

      <p class="order-text">
        Fill in your details and choose the product you want.
      </p>

      <form class="order-form" id="orderForm" >
        <!-- Emri dhe telefoni -->
        <div class="form-row form-row-two">
          <div class="form-field">
            <label for="fullName" class="form-label">Full Name</label>
            <input
              type="text"
              id="fullName"
              class="form-input"
              placeholder="John Doe"
              required
            />
            <small class="error" id="fullName-error"></small>
          </div>

          <div class="form-field">
            <label for="phone" class="form-label">Phone</label>
            <input
              type="tel"
              id="phone"
              class="form-input"
              placeholder="+383 xx xxx xxx"
              required
            />
            <small class="error" id="phone-error"></small>
          </div>
        </div>

        <!-- Email dhe qyteti -->
        <div class="form-row form-row-two">
          <div class="form-field">
            <label for="email" class="form-label">Email</label>
            <input
              type="email"
              id="email"
              class="form-input"
              placeholder="example@gmail.com"
              required
            />
            <small class="error" id="email-error"></small>
          </div>

          <div class="form-field">
            <label for="city" class="form-label">City</label>
            <input
              type="text"
              id="city"
              class="form-input"
              placeholder="Prishtina"
              required
            />
            <small class="error" id="city-error"></small>
          </div>
        </div>

        <!-- Adresa -->
        <div class="form-row">
          <div class="form-field">
            <label for="address" class="form-label">Address</label>
            <input
              type="text"
              id="address"
              class="form-input"
              placeholder="Street, number, entrance..."
              required
            />
            <small class="error" id="address-error"></small>
          </div>
        </div>

        <!-- Produkti dhe sasia -->
        <div class="form-row form-row-two">
          <div class="form-field">
            <label for="product" class="form-label">Choose Product</label>
            <select id="product" class="form-input" required>
              <option value="" disabled selected>Select a product</option>
              <option value="sofa" data-price="165">Nordwood Sideboard – 165€</option>
              <option value="chair" data-price="165">Elara Upholstered Chair- 165€</option>
              <option value="table" data-price="300">Slate Duo Sofa- 300€</option>
              <option value="bed" data-price="300">Terra Curve Loveseat- 300€</option>
                 <option value="bed" data-price="250">Oakline Dining Table- 250€</option>
                    <option value="bed" data-price="165">Vetro Display Cabinet- 165€</option>
                       <option value="bed" data-price="220">Haven Solid Wood Table- 220€</option>
                          <option value="bed" data-price="165">Noir Comfort Chair- 165€</option>
            </select>
            <small class="error" id="product-error"></small>
          </div>

          <div class="form-field">
            <label for="quantity" class="form-label">Quantity</label>
            <input
              type="number"
              id="quantity"
              class="form-input"
              min="1"
              value="1"
              required
            />
            <small class="error" id="quantity-error"></small>
          </div>
        </div>

        <!-- Ngjyra dhe materiali -->
        <div class="form-row form-row-two">
          <div class="form-field">
            <label for="color" class="form-label">Color</label>
            <select id="color" class="form-input">
              <option value="" disabled selected>Select color</option>

              <option value="white">White</option>
              <option value="gray">Gray</option>
              <option value="black">Black</option>
            </select>
            <small class="error" id="color-error"></small>
          </div>

          <div class="form-field">
            <label for="material" class="form-label">Material</label>
            <select id="material" class="form-input">
              <option value="" disabled selected>Select material</option>
              <option value="wood">Wood</option>
              <option value="metal">Metal</option>
              <option value="fabric">Fabric</option>
              <option value="leather">Leather</option>
            </select>
            <small class="error" id="material-error"></small>
          </div>
        </div>


        <!-- Shënime shtesë -->
        <div class="form-row">
          <div class="form-field">
            <label for="notes" class="form-label">Additional Notes</label>
            <textarea
              id="notes"
              class="form-input form-textarea"
              rows="4"
              placeholder="Floor, entrance, special requests..."
            ></textarea>
            <small class="error" id="notes-error"></small>
          </div>
        </div>

        <div class="form-row order-summary-row">
          <div class="order-summary">
            <span>Estimated total:</span>
            <strong id="orderTotal">0€</strong>
          </div>

        
         <div class="form-field" style="align-items: flex-end;">
          <button type="submit" class="order-btn">Continue to payment</button>
         </div>
          
<div class="order-extra-actions">
<button type="button" id="detailsBtn" class="order-btn">
  View order details
</button>
</div>

        </div>
      </form>
    </section>

    <div id="footer"></div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="JS/orderpage.js"></script>
    <script src="JS/script.js"></script>
    <script src="JS/jQuery.js"></script>
  </body>
</html>
