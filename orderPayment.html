<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="CSS/orderPAY.css" />
    <link rel="stylesheet" href="CSS/style.css" />
    <title></title>
  </head>
  <body>
    <section class="payment-section">
      <div class="payment-methods">
        <label class="payment-method">
          <input type="radio" name="payMethod" checked />
          <span>Kartelë bankare</span>
        </label>
        <label class="payment-method">
          <input type="radio" name="payMethod" />
          <span>Metodë tjetër</span>
        </label>
      </div>

      <form class="payment-form" id="payment-form">
        <h1 class="payment-title">Emri në kartelë</h1>

        <div class="form-field">
          <input
            id="card-name"
            type="text"
            class="form-input"
            placeholder="Emri juaj"
            required
          />
          <small class="error" id="card-name-error"></small>
        </div>

        <div class="form-row form-row-two">
          <div class="form-field">
            <label class="form-label">Numri i kartelës</label>
            <input
              id="card-number"
              type="text"
              class="form-input"
              placeholder="XXXX XXXX XXXX XXXX"
              required
            />
            <small class="error" id="card-number-error"></small>
          </div>

          <div class="form-field">
            <label class="form-label">CVV</label>
            <input
              type="text"
              class="form-input"
              id="cvv"
              placeholder="XXX"
              required
            />
            <small class="error" id="cvv-error"></small>
          </div>
        </div>

        <div class="form-field">
          <label class="form-label">Data e skadimit</label>
          <input
            id="expiry"
            type="text"
            class="form-input"
            placeholder="MM/YY"
            required
          />
          <small class="error" id="expiry-error"></small>
        </div>

        <label class="payment-check">
          <input id="terms" type="checkbox" required />
          <span>
            Kam lexuar dhe pajtohem me
            <a href="#">Kushtet dhe Rregullat</a>.
          </span>
        </label>
        <small class="error" id="terms-error"></small>

        <button type="submit" class="payment-btn">BËJ PAGESËN</button>
      </form>
    </section>

    <script src="JS/order.js"></script>
  </body>
</html>
