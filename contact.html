<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>

    <link rel="stylesheet" href="CSS/style.css" />
    <link rel="stylesheet" href="CSS/contactstyle.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>

  <body>
    <div id="navbar"></div>

    <div class="box">
      <div class="input-elementet">
        <h2>Contact Us</h2>
        <input type="text" placeholder="Emri dhe Mbiemri" />
        <input type="text" placeholder="Email Adresa" />
        <input type="number" placeholder="+383 xx xxx xxx" />
        <textarea placeholder="Shkruani mesazhin tuaj këtu..."></textarea>
        <button type="submit">Dergo Mesazhin</button>
      </div>

      <a href="#" class="pic-link">
        <img src="Image/contact img.jpg" alt="Contact image" />
      </a>
    </div>

    <footer>
      <div class="footer-content">
        <div class="info-Icons">
          <h3>Contact Info</h3>

          <div class="text-icon">
            <i class="fas fa-location-dot"></i>
            <a href="#">Adem Jashari 210, Skenderaj 41000</a>
          </div>

          <div class="text-icon">
            <i class="fas fa-location-dot"></i>
            <a
              href="https://www.google.com/maps/place/Royal+Mall/@42.6538179,21.1747672,17z"
              >Rruga B, Prishtinë 10000</a
            >
          </div>

          <div class="text-icon">
            <i class="fa-solid fa-envelope"></i>
            <a href="mailto:furniture@gmail.com">furniture@gmail.com</a>
          </div>

          <div class="text-icon">
            <i class="fa-solid fa-phone"></i>
            <a href="tel:+38344xxxxxx">+383 44 xxx xxx</a>
          </div>

          <div class="text-icon">
            <i class="fa-brands fa-facebook"></i>
            <a href="#">Facebook</a>
          </div>
        </div>

        <div class="social-icons">
          <h3>Follow Us</h3>

          <div class="text-icon">
            <i class="fa-brands fa-instagram"></i>
            <a href="#">Furniture</a>
          </div>

          <div class="text-icon">
            <i class="fa-brands fa-facebook"></i>
            <a href="#">Furniture Kosova</a>
          </div>

          <div class="text-icon">
            <i class="fa-brands fa-x-twitter"></i>
            <a href="#">_furniture</a>
          </div>
        </div>
      </div>

      <p>CopyRight &copy;</p>
    </footer>

    <script src="JS/script.js"></script>
  </body>
</html>
