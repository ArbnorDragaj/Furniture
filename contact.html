<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>A&O Furniture/Contact Us</title>

    <link rel="stylesheet" href="CSS/style.css" />

    <div class="box">
      <div class="input-elementet">

        <input type="text" placeholder="Email Adresa" id="email" />
        <input type="number" placeholder="+383 xx xxx xxx" id="phone"/>
        <textarea placeholder="Please leave a message..." id="message"></textarea>
        <button type="submit" id="sendBtn">Send Message</button>
        <textarea placeholder="Shkruani mesazhin tuaj këtu..." id="message"></textarea>
        <button type="submit" id="sendBtn">Dergo Mesazhin</button>
      </div>

      <a href="#" class="pic-link">
        <img src="Image/contact img.jpg" alt="Contact image" />
      </a>
    </div>

    <!-- Footer -->
    <div id="footer"></div>

    <script src="JS/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="JS/contact.js"></script>
